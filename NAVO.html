<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVO — Information Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', sans-serif; background: #fff; color: #1A1A1A; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #f7f8fa; } ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .page-enter { animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Data -->
<script src="data.js"></script>

<!-- Components (plain Babel) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ArticlePage.jsx"></script>
<script type="text/babel" src="CategoryPage.jsx"></script>
<script type="text/babel" src="SearchPage.jsx"></script>
<script type="text/babel" src="AuthorPage.jsx"></script>
<script type="text/babel" src="AuthPage.jsx"></script>

<!-- App shell -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#323F90",
  "secondaryColor": "#1486C8",
  "accentBreaking": "#E53935",
  "fontScale": 1.05,
  "cardStyle": "shadow",
  "density": "comfortable",
  "sidebarVisible": true
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Inject tweaks as CSS vars
  React.useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--primary', tweaks.primaryColor);
    r.setProperty('--secondary', tweaks.secondaryColor);
    r.setProperty('--breaking', tweaks.accentBreaking);
    r.setProperty('--font-scale', tweaks.fontScale);
  }, [tweaks]);

  // Override C colors with tweaks
  React.useEffect(() => {
    if (window.C) {
      window.C.primary = tweaks.primaryColor;
      window.C.secondary = tweaks.secondaryColor;
      window.C.breaking = tweaks.accentBreaking;
    }
  }, [tweaks.primaryColor, tweaks.secondaryColor, tweaks.accentBreaking]);

  // Language state
  const [lang, setLang] = React.useState('en');

  // Navigation state
  const [page, setPage] = React.useState('home'); // home | article | category | search | auth
  const [currentArticle, setCurrentArticle] = React.useState(null);
  const [currentCategory, setCurrentCategory] = React.useState(null);
  const [currentAuthor, setCurrentAuthor] = React.useState(null);
  const [searchQuery, setSearchQuery] = React.useState('');
  const [pageKey, setPageKey] = React.useState(0);

  const navigate = (target, data, query) => {
    window.scrollTo({ top: 0 });
    setPageKey(k => k + 1);
    if (target === 'home') { setPage('home'); setCurrentCategory(null); }
    else if (target === 'article') { setCurrentArticle(data); setPage('article'); }
    else if (target === 'author') { setCurrentAuthor(data); setPage('author'); }
    else if (target === 'category') { setCurrentCategory(data); setPage('category'); }
    else if (target === 'search') { setSearchQuery(query || ''); setPage('search'); }
    else if (target === 'auth') { setPage('auth'); }
  };

  const renderPage = () => {
    const props = { navigate };
    switch (page) {
      case 'author': return <AuthorPage author={currentAuthor} {...props} />;
      case 'home': return <HomePage {...props} />;
      case 'article': return <ArticlePage article={currentArticle} {...props} />;
      case 'category': return <CategoryPage category={currentCategory} {...props} />;
      case 'search': return <SearchPage initialQuery={searchQuery} {...props} />;
      case 'auth': return <AuthPage {...props} />;
      default: return <HomePage {...props} />;
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', fontSize: `${tweaks.fontScale}rem` }}>
      <NAVOHeader currentPage={page} navigate={navigate} currentCategory={currentCategory} lang={lang} setLang={setLang} />
      <main style={{ flex: 1 }}>
        <div key={pageKey} className="page-enter">
          {renderPage()}
        </div>
      </main>
      <NAVOFooter navigate={navigate} />

      <TweaksPanel>
        <TweakSection title="Language">
          <TweakRadio id="lang" label="Language" options={['en', 'ru', 'tj']} value={lang} onChange={v => setLang(v)} />
        </TweakSection>
        <TweakSection title="Brand Colors">
          <TweakColor id="primaryColor" label="Primary" value={tweaks.primaryColor} onChange={v => setTweak('primaryColor', v)} />
          <TweakColor id="secondaryColor" label="Links & Hover" value={tweaks.secondaryColor} onChange={v => setTweak('secondaryColor', v)} />
          <TweakColor id="accentBreaking" label="Breaking News" value={tweaks.accentBreaking} onChange={v => setTweak('accentBreaking', v)} />
        </TweakSection>
        <TweakSection title="Typography">
          <TweakSlider id="fontScale" label="Font Scale" min={0.85} max={1.2} step={0.05} value={tweaks.fontScale} onChange={v => setTweak('fontScale', v)} />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio id="cardStyle" label="Card Style" options={['shadow', 'bordered', 'flat']} value={tweaks.cardStyle} onChange={v => setTweak('cardStyle', v)} />
          <TweakRadio id="density" label="Density" options={['compact', 'comfortable', 'spacious']} value={tweaks.density} onChange={v => setTweak('density', v)} />
          <TweakToggle id="sidebarVisible" label="Show Sidebar" value={tweaks.sidebarVisible} onChange={v => setTweak('sidebarVisible', v)} />
        </TweakSection>
        <TweakSection title="Navigate to">
          <TweakButton label="Author Profile" onClick={() => navigate('author', NAVO_DATA.authors[0])} />
          <TweakButton label="Homepage" onClick={() => navigate('home')} />
          <TweakButton label="Article" onClick={() => navigate('article', NAVO_DATA.articles[0])} />
          <TweakButton label="Category — World" onClick={() => navigate('category', 'World')} />
          <TweakButton label="Search" onClick={() => navigate('search')} />
          <TweakButton label="Auth / Login" onClick={() => navigate('auth')} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
